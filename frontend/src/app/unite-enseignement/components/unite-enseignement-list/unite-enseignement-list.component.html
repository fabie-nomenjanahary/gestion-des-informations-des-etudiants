<div class="row">
  <h2> Liste des unités d'enseignements</h2>
</div>
<div class="demo-button-container">
  <button mat-fab color="primary" matTooltip="Nouveau niveau" class="demo-button" (click)="openDialog()">
      <mat-icon>add</mat-icon>
  </button>
</div>
<div class="container">
  <div style="margin-top: 10px;">
      <mat-form-field appearance="outline">
          <mat-label>Rechercher...</mat-label>
          <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Communication" #input>
      </mat-form-field>

      <div class="mat-elevation-z8">
          <table mat-table [dataSource]="dataSource" matSort>

              <ng-container matColumnDef="nom">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header> Unité d'Enseignement</th>
                  <td mat-cell *matCellDef="let row"> {{row.nom}} </td>
              </ng-container>

              <ng-container matColumnDef="creditUE">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header> Crédit UE </th>
                  <td mat-cell *matCellDef="let row">{{row.creditUE}}</td>
              </ng-container>
              <ng-container matColumnDef="parcours">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header> Parcours </th>
                  <td mat-cell *matCellDef="let row">{{row.parcour.libelle}}</td>
              </ng-container>
              <ng-container matColumnDef="niveau">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header> Niveau </th>
                  <td mat-cell *matCellDef="let row">{{row.semestre.niveau.libelle}}</td>
              </ng-container>
              <ng-container matColumnDef="semestre">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header> Semestre </th>
                  <td mat-cell *matCellDef="let row">{{row.semestre.nom}}</td>
              </ng-container>
               <ng-container matColumnDef="matieres">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header> Matières </th>
                  <td mat-cell *matCellDef="let row">{{row.matieres.length}}</td>
              </ng-container>

              <ng-container matColumnDef="actions">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header> Actions </th>
                  <td mat-cell *matCellDef="let row" class="action">
                      <button mat-icon-button color="primary" matTooltip="Details" (click)="openDetailsDialog(row)">
                          <mat-icon>info</mat-icon>
                      </button>
                      <button mat-icon-button color="success" matTooltip="Ajouter une matière" (click)="openAddMatiereDialog(row)">
                          <mat-icon>add</mat-icon>
                      </button>
                      <button mat-icon-button color="accent" matTooltip="Modifier" (click)="openEditDialog(row)">
                          <mat-icon>edit</mat-icon>
                      </button>
                      <button mat-icon-button color="warn" matTooltip="Supprimer" (click)="openDeleteDialog(row.id)">
                          <mat-icon>delete</mat-icon>
                      </button>
                      <button mat-icon-button color="primary" matTooltip="Voir toutes les matières" (click)="openUEMatieresDialog(row)">
                          <mat-icon>more</mat-icon>
                      </button>
                  </td>
              </ng-container>

              <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

              <!-- Row shown when there is no matching data. -->
              <tr class="mat-row" *matNoDataRow>
                  <td class="mat-cell" colspan="4">Aucun résultat trouvé pour "{{input.value}}"</td>
              </tr>
          </table>
          <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]"
              aria-label="Choisir la page des unités d'enseignements"></mat-paginator>
      </div>
  </div>
</div>
