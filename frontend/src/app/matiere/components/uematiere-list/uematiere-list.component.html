<div class="row">
  <h2> {{title}}</h2>
</div>
<div class="demo-button-container">
  <button mat-fab color="primary" matTooltip="Nouvelle matière" class="demo-button" (click)="openDialog()">
      <mat-icon>add</mat-icon>
  </button>
</div>
<div class="container">
  <div style="margin-top: 10px;">
      <mat-form-field appearance="outline">
          <mat-label>Rechercher...</mat-label>
          <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Communication" #input>
      </mat-form-field>

      <div class="mat-elevation-z8">
          <table mat-table [dataSource]="dataSource" matSort>

              <ng-container matColumnDef="nom">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header> Nom de la matière</th>
                  <td mat-cell *matCellDef="let row"> {{row.nom}} </td>
              </ng-container>

              <ng-container matColumnDef="ET">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header> ET </th>
                  <td mat-cell *matCellDef="let row">{{row.ET}}</td>
              </ng-container>
              <ng-container matColumnDef="ED">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header> ED </th>
                  <td mat-cell *matCellDef="let row">{{row.ED}}</td>
              </ng-container>
              <ng-container matColumnDef="EP">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header> EP </th>
                  <td mat-cell *matCellDef="let row">{{row.EP}}</td>
              </ng-container>
              <ng-container matColumnDef="creditEC">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header> Crédit EC </th>
                  <td mat-cell *matCellDef="let row">{{row.creditEC}}</td>
              </ng-container>
               <ng-container matColumnDef="poidsEC">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header> Poids EC </th>
                  <td mat-cell *matCellDef="let row">{{row.poidsEC}}</td>
              </ng-container>

              <ng-container matColumnDef="actions">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header> Actions </th>
                  <td mat-cell *matCellDef="let row" class="action">
                      <button mat-icon-button color="accent" matTooltip="Modifier" (click)="openEditDialog(row)">
                          <mat-icon>edit</mat-icon>
                      </button>
                      <button mat-icon-button color="warn" matTooltip="Supprimer" (click)="openDeleteDialog(row.id)">
                          <mat-icon>delete</mat-icon>
                      </button>
                  </td>
              </ng-container>

              <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

              <!-- Row shown when there is no matching data. -->
              <tr class="mat-row" *matNoDataRow>
                  <td class="mat-cell" colspan="4">Aucun résultat trouvé pour "{{input.value}}"</td>
              </tr>
          </table>
          <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]"
              aria-label="Choisir la page des unités d'enseignements"></mat-paginator>
      </div>
  </div>
</div>
